[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sih-gujarat-backend"
version = "0.1.0"
description = "SIH 26130 Gujarat Industrial Approval Intelligence — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.0,<3",
    "PyJWT>=2.8,<3",
    "python-dateutil>=2.9,<3",
    "supabase>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
    "pypdf>=4.0,<5",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
